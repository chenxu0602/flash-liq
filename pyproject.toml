[project]
name = "flash-liq"
version = "0.1.0"
description = "Liquidation research tools for Morpho and flash-loan workflows"
readme = "README.md"
authors = [
    { name = "chenxu", email = "chen.xu.wq@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
flash-liq = "flash_liq.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
